<html>
    <head>
        <title>Retina Woods</title>
        <link rel="stylesheet" href="woods.css">
        <style>
            body{
                background-color: white;
            }
            p{
                font-family: monospace;
                color: blanchedalmond;
                font-size: 4rem;
                text-align: center;
                margin-top: 400px;
                animation: appear 10s;

            }
