<html>
    <head>
        <title>Retina Woods</title>
        <link rel="stylesheet" href="woods.css">
        <style>
            .first{
                color: rgb(78, 2, 2);
                font-family: 'Courier New', Courier, monospace;
                font-size: 4rem;
                font-weight: 100;
                text-align: center;
                margin-top: 400px;
                }
            .return{
                color: rgb(78, 2, 2);

                90% {opacity:0;}
                100% {opacity: 1;}
            }
        </style>
